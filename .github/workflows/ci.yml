name: CI

on:
  pull_request:
    branches: [main]

env:
  DOCKER_BUILDKIT: 1

jobs:
  # ============================================================
  # JOB 1: Lint (Fast feedback - only needs source files)
  # ============================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Build app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: illo3d-app:latest
          cache-from: type=gha
          no-cache: true

      - name: Start app container
        run: docker compose up -d --no-build app

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

  # ============================================================
  # JOB 2: Unit Tests (Fast feedback - only needs source files)
  # ============================================================
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Build app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: illo3d-app:latest
          cache-from: type=gha
          no-cache: true

      - name: Start app container
        run: docker compose up -d --no-build app

      - name: Install dependencies
        run: make install

      - name: Unit tests
        run: make test

  # ============================================================
  # JOB 3: Build (TypeScript + Vite compilation)
  # ============================================================
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Build app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: illo3d-app:latest
          cache-from: type=gha
          no-cache: true

      - name: Start app container
        run: docker compose up -d --no-build app

      - name: Install dependencies
        run: make install

      - name: Build
        run: make build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ============================================================
  # JOB 4: E2E Tests (Requires built app + playwright image)
  # ============================================================
  e2e-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Build app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: illo3d-app:latest
          cache-from: type=gha

      - name: Build Playwright image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.playwright
          push: false
          load: true
          tags: illo3d-playwright:latest
          cache-from: type=gha

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Start services
        run: docker compose up -d

      - name: Install dependencies
        run: make install

      - name: E2E tests
        run: make e2e-test

  # ============================================================
  # Auto-merge (depends on all quality jobs)
  # Same-repo branches only: fork PRs get a read-limited token and must not be auto-approved here.
  # ============================================================
  auto-merge:
    runs-on: ubuntu-latest
    needs: [lint, unit-test, build, e2e-test]
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Approve dependabot pull request
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable merge-commit auto-merge
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
