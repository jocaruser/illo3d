name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract current version
        id: current
        run: |
          VERSION=$(sed -n "s/.*APP_VERSION *= *'\([^']*\)'.*/\1/p" src/config/version.ts)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if release exists
        id: check
        run: |
          if gh release view "v${{ steps.current.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changelog file and previous tag
        if: steps.check.outputs.exists == 'false'
        id: changelog
        run: |
          VERSION="${{ steps.current.outputs.version }}"
          FILE="changelog/v${VERSION}.md"
          if [ -f "$FILE" ]; then
            echo "has_changelog=true" >> $GITHUB_OUTPUT
            echo "file=$FILE" >> $GITHUB_OUTPUT
          else
            echo "has_changelog=false" >> $GITHUB_OUTPUT
          fi
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 || true)
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release from changelog
        if: steps.check.outputs.exists == 'false' && steps.changelog.outputs.has_changelog == 'true'
        run: |
          {
            cat "${{ steps.changelog.outputs.file }}"
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.changelog.outputs.previous_tag }}...v${{ steps.current.outputs.version }}"
          } > /tmp/release-notes.md
          gh release create "v${{ steps.current.outputs.version }}" \
            --title "v${{ steps.current.outputs.version }}" \
            --notes-file /tmp/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with generated notes
        if: steps.check.outputs.exists == 'false' && steps.changelog.outputs.has_changelog != 'true'
        run: |
          gh release create "v${{ steps.current.outputs.version }}" \
            --title "v${{ steps.current.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger deploy
        if: steps.check.outputs.exists == 'false'
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
