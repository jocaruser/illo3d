name: Build app
description: >
  The one production build: CI's `build` job gates every PR with it and the
  Pages deploy ships its dist/, so a build deploy would fail on fails the PR
  first. It runs inside the app image (the same Node and pnpm as every other
  gate) — keep runner-side Node/pnpm out of here; `make toolchain` enforces that.
  Expects the repository to be checked out.

inputs:
  google-client-id:
    description: VITE_GOOGLE_CLIENT_ID baked into the bundle (deploy only)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache pnpm store
      uses: actions/cache@v4
      with:
        path: ~/.pnpm-store
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Build app image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: false
        load: true
        tags: illo3d-app:latest
        cache-from: type=gha
        no-cache: true

    - name: Start app container
      shell: bash
      run: docker compose up -d --no-build app

    - name: Install dependencies
      shell: bash
      run: make install

    - name: Toolchain pins
      shell: bash
      run: make toolchain

    - name: Build
      shell: bash
      run: make build
      env:
        VITE_GOOGLE_CLIENT_ID: ${{ inputs.google-client-id }}

    # google-drive-api-mock is the e2e-only Drive/Sheets emulator; it must never
    # reach the bundle CI gates and deploy ships.
    - name: Assert emulator absent from bundle
      shell: bash
      run: |
        if grep -rl "google-drive-api-mock" dist/; then
          echo "::error::google-drive-api-mock is bundled in dist/ (files above)"
          exit 1
        fi

    - name: Bundle budget (P2)
      shell: bash
      run: docker compose exec app node scripts/check-bundle-budget.mjs
