services:
  app:
    image: illo3d-app
    build: .
    volumes:
      - .:/app
    # APP_PORT=0 publishes an ephemeral host port, so several checkouts (or runner
    # slots) can bring the stack up on one host. `make urls` reads back what was bound.
    ports:
      - "${APP_PORT:-5173}:5173"
    working_dir: /app
    environment:
      - NODE_ENV=development
    command: tail -f /dev/null
    networks:
      illo3d-network:
        aliases:
          - web

  playwright:
    image: illo3d-playwright
    build:
      context: .
      dockerfile: Dockerfile.playwright
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - NODE_ENV=development
    networks:
      - illo3d-network

  # Live Drive v3 + Sheets v4 double for e2e (see specs/decisions/). Reached
  # only from inside the compose network, by service name — no host port.
  google-mock:
    image: ghcr.io/jocaruser/google-drive-api-mock:v0.2.1
    volumes:
      - ./.e2e-google-mock:/data
    networks:
      - illo3d-network

networks:
  illo3d-network:
    driver: bridge
