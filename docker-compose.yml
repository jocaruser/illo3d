services:
  app:
    image: illo3d-app
    build: .
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    working_dir: /app
    environment:
      - NODE_ENV=development
    command: tail -f /dev/null
    networks:
      illo3d-network:
        aliases:
          - web

  playwright:
    image: illo3d-playwright
    build:
      context: .
      dockerfile: Dockerfile.playwright
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - NODE_ENV=development
    networks:
      - illo3d-network

networks:
  illo3d-network:
    driver: bridge
