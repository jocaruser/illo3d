services:
  app:
    image: illo3d-app
    build: .
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    working_dir: /app
    environment:
      - NODE_ENV=development
    command: tail -f /dev/null
    networks:
      illo3d-network:
        aliases:
          - web

  # Specs wiki (engine: jocaruser/github-md-live-wiki). Only starts when
  # explicitly requested (make wiki) thanks to the profile.
  wiki:
    image: ghcr.io/jocaruser/github-md-live-wiki:v1
    ports:
      - "5176:5176"
    environment:
      - CONTENT_REPO=jocaruser/illo3d
      - APP_URL=https://jocaruser.github.io/illo3d/
    volumes:
      - ./specs:/content:ro
    profiles: [wiki]

  playwright:
    image: illo3d-playwright
    build:
      context: .
      dockerfile: Dockerfile.playwright
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - NODE_ENV=development
    networks:
      - illo3d-network

networks:
  illo3d-network:
    driver: bridge
